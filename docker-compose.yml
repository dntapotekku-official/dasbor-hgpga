services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: performance-report-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_HOST: 0.0.0.0
    volumes:
      - ./cache:/app/.next/cache
